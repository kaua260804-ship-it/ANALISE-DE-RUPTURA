<!-- Filters -->
<section class="filters">
    <div class="filter-header">
        <h2>Filtros</h2>
        <button id="btnLimparFiltros" class="btn-secondary">Limpar Filtros</button>
    </div>
    <div class="filter-grid">
        <div class="filter-group">
            <label for="filterMediaVdAcima">Média de VD Acima de</label>
            <input type="number" id="filterMediaVdAcima" placeholder="Ex: 20" class="filter-input" min="0" step="0.01">
        </div>
        
        <div class="filter-group">
            <label for="filterMediaVdAbaixo">Média de VD Abaixo de</label>
            <input type="number" id="filterMediaVdAbaixo" placeholder="Ex: 100" class="filter-input" min="0" step="0.01">
        </div>
        
        <div class="filter-group">
            <label for="filterCodigo">Código Produto</label>
            <input type="text" id="filterCodigo" placeholder="Digite o código..." class="filter-input">
        </div>
        
        <div class="filter-group">
            <label for="filterProduto">Produto</label>
            <input type="text" id="filterProduto" placeholder="Digite o produto..." class="filter-input">
        </div>
        
        <div class="filter-group">
            <label for="filterEmpresa">Empresa (Múltipla)</label>
            <select id="filterEmpresa" class="filter-input" multiple size="4">
                <option value="">Todas Empresas</option>
            </select>
        </div>
        
        <div class="filter-group">
            <label for="filterComprador">Comprador (Múltiplo)</label>
            <select id="filterComprador" class="filter-input" multiple size="4">
                <option value="">Todos Compradores</option>
            </select>
        </div>
        
        <div class="filter-group">
            <label for="filterCategoria">Categoria (Múltipla)</label>
            <select id="filterCategoria" class="filter-input" multiple size="4">
                <option value="">Todas Categorias</option>
            </select>
        </div>
        
        <div class="filter-group">
            <label for="filterGrupo">Grupo (Múltiplo)</label>
            <select id="filterGrupo" class="filter-input" multiple size="4">
                <option value="">Todos Grupos</option>
            </select>
        </div>
        
        <div class="filter-group">
            <label for="filterSubgrupo">Subgrupo (Múltiplo)</label>
            <select id="filterSubgrupo" class="filter-input" multiple size="4">
                <option value="">Todos Subgrupos</option>
            </select>
        </div>
        
        <div class="filter-group">
            <label for="filterRuptura">Ruptura</label>
            <select id="filterRuptura" class="filter-input">
                <option value="">Todas Rupturas</option>
                <option value="RUPTURA LOJA">RUPTURA LOJA</option>
                <option value="RUPTURA GERAL">RUPTURA GERAL</option>
                <option value="POSSIVEL RUPTURA">POSSÍVEL RUPTURA</option>
                <option value="SEM RUPTURA">SEM RUPTURA</option>
            </select>
        </div>
        
        <div class="filter-group">
            <label for="filterStatusEstoque">Status Estoque (Múltiplo)</label>
            <select id="filterStatusEstoque" class="filter-input" multiple size="4">
                <option value="">Todos Status</option>
                <option value="COM ESTOQUE LOJA / COM ESTOQUE CDBR">COM ESTOQUE LOJA / COM ESTOQUE CDBR</option>
                <option value="SEM ESTOQUE LOJA / SEM ESTOQUE CDBR">SEM ESTOQUE LOJA / SEM ESTOQUE CDBR</option>
                <option value="COM ESTOQUE LOJA / SEM ESTOQUE CDBR">COM ESTOQUE LOJA / SEM ESTOQUE CDBR</option>
                <option value="SEM ESTOQUE LOJA / COM ESTOQUE CDBR">SEM ESTOQUE LOJA / COM ESTOQUE CDBR</option>
            </select>
        </div>
        
        <div class="filter-group">
            <label for="filterTemVenda">Vendas</label>
            <select id="filterTemVenda" class="filter-input">
                <option value="">Todas Vendas</option>
                <option value="COM VENDA">COM VENDA</option>
                <option value="SEM VENDA">SEM VENDA</option>
            </select>
        </div>
    </div>
</section>

<!-- Mini Tables -->
<section class="mini-tables">
    <div class="mini-table-container">
        <h3>TOP 10 PRODUTOS EM RUPTURA GERAL</h3>
        <div id="topProdutosTable" class="mini-table-content"></div>
    </div>
    <div class="mini-table-container">
        <h3>RUPTURA POR LOJA</h3>
        <div id="rupturaPorLojaTable" class="mini-table-content"></div>
    </div>
    <div class="mini-table-container">
        <h3>Resumo de Rupturas</h3>
        <div id="rupturasTable" class="mini-table-content"></div>
    </div>
    <div class="mini-table-container">
        <h3>Status de Estoque</h3>
        <div id="statusEstoqueTable" class="mini-table-content"></div>
    </div>
</section>
